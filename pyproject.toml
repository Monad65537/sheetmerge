[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetmerge"
version = "0.1.0"
description = "Auditable consolidation and reconciliation of sales CSV and XLSX files"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sheetmerge = "sheetmerge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

